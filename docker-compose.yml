services:
  postgres-auth:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5433:5432"
    volumes:
      - auth_data:/var/lib/postgresql/data

  postgres-rutas:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rutas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5434:5432"
    volumes:
      - rutas_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: Oracle123
      APP_USER: flota
      APP_USER_PASSWORD: Flota123
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbit_data:/var/lib/rabbitmq

volumes:
  auth_data:
  rutas_data:
  mongo_data:
  oracle_data:
  rabbit_data:
